name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-gi python3-pytest \
            libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Lint (compile)
        run: make lint
      - name: Tests
        run: PYTHONPATH=src make test
      - name: Import smoke
        run: PYTHONPATH=src python3 -c "import native_app; print(native_app.__version__)"